<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- use-credentials: el navegador pide el manifest sin cookies; en los previews de Vercel
         (protegidos con inicio de sesión) eso devuelve una redirección y la PWA no se puede
         instalar. Mismo origen, así que en producción no cambia nada. -->
    <link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />
    <!-- iOS no acepta SVG como ícono de inicio: PNG de 180 px a sangre (iOS redondea las esquinas) -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <!-- viewport-fit=cover para ocupar la pantalla completa en iPhone con notch -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0e14" />
    <!-- Evita que iOS agregue comportamientos de app por encima del video -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>MovexNet</title>
    <!-- Nombre bajo el ícono al instalar en iOS y en algunos Android (DEC-068) -->
    <meta name="apple-mobile-web-app-title" content="MovexNet" />
    <meta name="application-name" content="MovexNet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
